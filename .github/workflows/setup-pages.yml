name: Setup Pages

# 一次性把 docs/ 目录开成 GitHub Pages 站点，之后每次改 docs 都会自动重新发布。
# 单独放一个流程，是因为启用 Pages 需要仓库级权限，普通 PAT 通常没有。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/setup-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-setup
  cancel-in-progress: true

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pages site from /docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          status=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")
          echo "GET /pages -> $status"
          if [ "$status" = "200" ]; then
            cat /tmp/pages.json
            echo "Pages 已经开好了"
            exit 0
          fi
          code=$(curl -s -o /tmp/create.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"source":{"branch":"main","path":"/docs"}}' \
            "https://api.github.com/repos/$REPO/pages")
          echo "POST /pages -> $code"
          cat /tmp/create.json
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::error::启用 Pages 失败，需要在仓库 Settings -> Pages 手动把 Source 设为 main /docs"
            exit 1
          fi

      - name: Wait for build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          for i in $(seq 1 20); do
            state=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pages" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('status',''),d.get('html_url',''))" 2>/dev/null || echo "")
            echo "第 $i 次：$state"
            case "$state" in
              *built*|*"null"*) break ;;
            esac
            sleep 15
          done
          echo "页面地址见 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
