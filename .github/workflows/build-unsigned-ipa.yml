name: Build unsigned IPA

# 没有 Mac 也能出包：
# 1. 把整个 VideoLinker 文件夹推到一个 GitHub 仓库
# 2. 打开仓库的 Actions 页面，等这个流程跑完
# 3. 在运行记录的 Artifacts 里下载 VideoLinker-ipa.zip，解压得到 .ipa
# 产物是未签名包，需要用 Sideloadly / AltStore / TrollStore 用你自己的 Apple ID 签名后才能装。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Cache VLCKit
        id: vlc-cache
        uses: actions/cache@v4
        with:
          path: Vendor
          key: mvlckit-374-ios-v1

      # VLCKit 3.7.3 没有 SPM 支持，这里直接取官方二进制包，只留 iOS 真机切片
      - name: Fetch VLCKit
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="https://download.videolan.org/pub/cocoapods/prod/MobileVLCKit-3.0-20260922-1512.tar.xz"
          rm -rf /tmp/vlc && mkdir -p /tmp/vlc Vendor
          curl -L --retry 5 --retry-delay 5 --max-time 1500 -o /tmp/vlc.tar.xz "$URL"
          ls -lh /tmp/vlc.tar.xz
          tar -xf /tmp/vlc.tar.xz -C /tmp/vlc
          echo "--- archive tree ---"
          find /tmp/vlc -maxdepth 6 -type d | head -50
          echo "--- frameworks ---"
          find /tmp/vlc -type d -name "*.framework" | head -20
          # 优先 iOS 真机切片，退一步取任意非模拟器切片
          FW="$(find /tmp/vlc -type d -name '*.framework' | grep -i 'ios-arm64' | grep -Ei 'vlckit' | head -1)"
          if [ -z "$FW" ]; then
            FW="$(find /tmp/vlc -type d -name '*.framework' | grep -Ei 'vlckit' | grep -v -i simulator | head -1)"
          fi
          if [ -z "$FW" ]; then
            echo "::error::VLCKit framework not found in archive"
            exit 1
          fi
          echo "using $FW"
          cp -R "$FW" Vendor/
          ls -la Vendor
          du -sh Vendor/*.framework

      # GRDB 走 Swift Package Manager，先把依赖拉下来；失败时这一步就会报，节省排查时间
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('VideoLinker.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -project VideoLinker.xcodeproj \
            -scheme VideoLinker \
            -derivedDataPath build \
            -resolvePackageDependencies 2>&1 | tail -40

      # AMSMB2 3.2.3 附带的 libsmb2 在 iOS SDK 下 HAVE_TIME_H 宏没生效，
      # smb2.h 里的 time_t 解析不出来。SPM 包的 cSettings 外部改不了，
      # 这里先确保 submodule 已初始化，再给头文件补一行 include。
      - name: Patch libsmb2 for iOS
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/build/SourcePackages/checkouts/AMSMB2"
          HDR="$PKG/Dependencies/libsmb2/include/smb2/smb2.h"
          if [ ! -f "$HDR" ]; then
            (cd "$PKG" && git submodule update --init --recursive)
          fi
          test -f "$HDR"
          chmod u+w "$HDR"
          python3 - "$HDR" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if "#include <time.h>" not in s:
              idx = s.find("#include")
              if idx >= 0:
                  s = s[:idx] + "#include <time.h>\n#include <sys/types.h>\n" + s[idx:]
              else:
                  s = "#include <time.h>\n#include <sys/types.h>\n" + s
              open(p, "w").write(s)
          print("patched:", "#include <time.h>" in open(p).read())
          PY
          grep -n 'include <time.h>' "$HDR"

      - name: Build (no code signing)
        run: |
          set -x
          VLC_ARGS=()
          VLC_MODULE=""
          if [ -d Vendor/VLCKit.framework ]; then
            VLC_MODULE="VLCKit"
          elif [ -d Vendor/MobileVLCKit.framework ]; then
            VLC_MODULE="MobileVLCKit"
          fi
          if [ -n "$VLC_MODULE" ]; then
            VLC_ARGS+=("FRAMEWORK_SEARCH_PATHS=$(pwd)/Vendor \$(inherited)")
            VLC_ARGS+=("OTHER_LDFLAGS=\$(inherited) -framework $VLC_MODULE -framework QuartzCore -framework CoreText -framework AVFoundation -framework Security -framework CFNetwork -framework AudioToolbox -framework OpenGLES -framework CoreGraphics -framework VideoToolbox -framework CoreMedia -lc++ -lxml2 -lz -lbz2 -liconv -ObjC")
            echo "linking $VLC_MODULE"
          fi
          xcodebuild \
            -project VideoLinker.xcodeproj \
            -scheme VideoLinker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_CFLAGS="\$(inherited) -DHAVE_TIME_H=1 -DHAVE_STDINT_H=1 -DHAVE_SYS_TYPES_H=1" \
            "${VLC_ARGS[@]}" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VideoLinker.app"
          test -d "$APP_PATH"
          rm -rf Payload VideoLinker-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          if ls Vendor/*.framework >/dev/null 2>&1; then
            mkdir -p Payload/VideoLinker.app/Frameworks
            cp -R Vendor/*.framework Payload/VideoLinker.app/Frameworks/
            echo "embedded frameworks:"
            du -sh Payload/VideoLinker.app/Frameworks/*
          fi
          # 只留 arm64：armv7/armv7s 对现在的设备没用，去掉能省一半体积
          for FW in Payload/VideoLinker.app/Frameworks/*.framework; do
            [ -d "$FW" ] || continue
            NAME=$(basename "$FW" .framework)
            BIN="$FW/$NAME"
            [ -f "$BIN" ] || continue
            echo "before: $(lipo -archs "$BIN" 2>/dev/null || echo unknown)"
            case "$(lipo -archs "$BIN" 2>/dev/null || echo)" in
              *arm64*)
                if lipo -thin arm64 "$BIN" -output "$BIN.arm64" 2>/dev/null; then
                  mv "$BIN.arm64" "$BIN"
                fi
                ;;
            esac
            echo "after: $(lipo -archs "$BIN" 2>/dev/null || echo unknown)"
          done
          echo "--- link check ---"
          otool -L Payload/VideoLinker.app/VideoLinker | grep -i -E "vlc" || echo "::warning::main binary is not linked with VLCKit"
          zip -qry VideoLinker-unsigned.ipa Payload
          rm -rf Payload
          ls -lh VideoLinker-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLinker-ipa
          path: VideoLinker-unsigned.ipa
          if-no-files-found: error
