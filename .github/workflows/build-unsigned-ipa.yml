name: Build unsigned IPA

# 没有 Mac 也能出包：
# 1. 把整个 VideoLinker 文件夹推到一个 GitHub 仓库
# 2. 打开仓库的 Actions 页面，等这个流程跑完
# 3. 在运行记录的 Artifacts 里下载 VideoLinker-ipa.zip，解压得到 .ipa
# 产物是未签名包，需要用 Sideloadly / AltStore / TrollStore 用你自己的 Apple ID 签名后才能装。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Cache VLCKit
        id: vlc-cache
        uses: actions/cache@v4
        with:
          path: Vendor
          key: vlckit-373-ios-arm64-v1

      # VLCKit 3.7.3 没有 SPM 支持，这里直接取官方二进制包，只留 iOS 真机切片
      - name: Fetch VLCKit
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="https://download.videolan.org/cocoapods/prod/VLCKit-3.7.3-319ed2c0-79128878.tar.xz"
          rm -rf /tmp/vlc && mkdir -p /tmp/vlc Vendor
          curl -L --retry 5 --retry-delay 5 --max-time 1500 -o /tmp/vlc.tar.xz "$URL"
          ls -lh /tmp/vlc.tar.xz
          tar -xf /tmp/vlc.tar.xz -C /tmp/vlc
          echo "--- archive ---"
          find /tmp/vlc -maxdepth 3 \( -name "*.framework" -o -name "*.xcframework" \) | head -20
          FW="$(find /tmp/vlc -type d -name 'MobileVLCKit.framework' | grep -v -i simulator | head -1)"
          if [ -z "$FW" ]; then
            XCF="$(find /tmp/vlc -type d -name 'MobileVLCKit.xcframework' | head -1)"
            if [ -n "$XCF" ]; then
              FW="$(find "$XCF" -maxdepth 2 -type d -name 'MobileVLCKit.framework' | grep -i 'ios-arm64' | head -1)"
            fi
          fi
          if [ -z "$FW" ]; then
            echo "::error::MobileVLCKit.framework not found in archive"
            exit 1
          fi
          echo "using $FW"
          cp -R "$FW" Vendor/
          du -sh Vendor/MobileVLCKit.framework

      - name: Build (no code signing)
        run: |
          set -x
          VLC_ARGS=()
          if [ -d Vendor/MobileVLCKit.framework ]; then
            VLC_ARGS+=("FRAMEWORK_SEARCH_PATHS=$(pwd)/Vendor \$(inherited)")
            VLC_ARGS+=("OTHER_LDFLAGS=\$(inherited) -framework MobileVLCKit -lc++ -lz -lbz2 -liconv -lxml2 -ObjC")
          fi
          xcodebuild \
            -project VideoLinker.xcodeproj \
            -scheme VideoLinker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "${VLC_ARGS[@]}" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VideoLinker.app"
          test -d "$APP_PATH"
          rm -rf Payload VideoLinker-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          if [ -d Vendor/MobileVLCKit.framework ]; then
            mkdir -p Payload/VideoLinker.app/Frameworks
            cp -R Vendor/MobileVLCKit.framework Payload/VideoLinker.app/Frameworks/
            echo "embedded VLCKit:"
            du -sh Payload/VideoLinker.app/Frameworks/MobileVLCKit.framework
          fi
          zip -qry VideoLinker-unsigned.ipa Payload
          rm -rf Payload
          ls -lh VideoLinker-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLinker-ipa
          path: VideoLinker-unsigned.ipa
          if-no-files-found: error
