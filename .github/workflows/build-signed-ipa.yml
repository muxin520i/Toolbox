name: Build signed IPA (optional)

# 只有在你拥有 Apple 开发者账号（付费 688 元/年，或免费 Apple ID 导出的证书）时才用这个流程。
# 需要先在仓库 Settings -> Secrets and variables -> Actions 里配置：
#   IOS_P12_BASE64                  证书 .p12 的 base64（base64 -i cert.p12 | pbcopy）
#   IOS_P12_PASSWORD                导出 .p12 时设置的密码
#   IOS_MOBILEPROVISION_BASE64      描述文件 .mobileprovision 的 base64
#   IOS_TEAM_ID                     10 位 Team ID
#   IOS_PROFILE_NAME                描述文件的 Name（不是文件名，用文本编辑器能看到）
#   IOS_BUNDLE_ID                   要和描述文件里的 App ID 完全一致，默认 com.example.VideoLinker
#
# 注意：本项目 Info.plist 允许了 http 明文访问，上架 App Store 需要向审核说明理由，
# 自签分发（Ad Hoc / 开发）不受影响。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm certificate.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # AMSMB2 3.2.3 附带的 libsmb2 在 iOS SDK 下 HAVE_TIME_H 宏没生效，
      # 给 smb2.h 补一行 include（同 unsigned 流程）。
      - name: Patch libsmb2 for iOS
        run: |
          set -euo pipefail
          xcodebuild -project VideoLinker.xcodeproj \
            -scheme VideoLinker \
            -derivedDataPath build \
            -resolvePackageDependencies >/dev/null 2>&1 || true
          PKG="$GITHUB_WORKSPACE/build/SourcePackages/checkouts/AMSMB2"
          HDR="$PKG/Dependencies/libsmb2/include/smb2/smb2.h"
          if [ ! -f "$HDR" ]; then
            (cd "$PKG" && git submodule update --init --recursive)
          fi
          test -f "$HDR"
          chmod u+w "$HDR"
          python3 - "$HDR" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if "#include <time.h>" not in s:
              s = s.replace("#ifdef HAVE_TIME_H", "#include <time.h>\n#ifdef HAVE_TIME_H", 1)
              open(p, "w").write(s)
          print("patched:", "#include <time.h>" in open(p).read())
          PY
          grep -n 'include <time.h>' "$HDR"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project VideoLinker.xcodeproj \
            -scheme VideoLinker \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/VideoLinker.xcarchive \
            -derivedDataPath build \
            OTHER_CFLAGS="\$(inherited) -DHAVE_TIME_H=1 -DHAVE_STDINT_H=1 -DHAVE_SYS_TYPES_H=1" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Development"

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          sed -e "s|__TEAM_ID__|$TEAM_ID|g" \
              -e "s|__BUNDLE_ID__|$BUNDLE_ID|g" \
              -e "s|__PROFILE_NAME__|$PROFILE_NAME|g" \
              tools/ExportOptions.plist > build/ExportOptions.plist
          plutil -lint build/ExportOptions.plist

          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/VideoLinker.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

          mkdir -p out
          cp build/export/*.ipa out/VideoLinker-signed.ipa
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLinker-signed-ipa
          path: out/VideoLinker-signed.ipa
          if-no-files-found: error
